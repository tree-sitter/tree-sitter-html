name: Fuzz parser

on:
  push:
    branches: [master]
    paths:
      - src/scanner.c
  pull_request:
    paths:
      - src/scanner.c

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: tree-sitter/setup-action@v2
        with:
          install-lib: false
      - name: Generate parser
        run: tree-sitter generate --abi=15
      - name: Run fuzzer
        uses: tree-sitter/fuzz-action@v4
